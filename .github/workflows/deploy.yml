# Bygger appen og publiserer den på GitHub Pages: https://<bruker>.github.io/<repo>/
# Ferdigbygde filer legges på branchen gh-pages, som Pages serverer.
name: Publiser på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tester
        run: |
          npm test
          npm run test:db
      - name: Bygg
        run: npm run build
        env:
          # Appen ligger under /<repo>/ på GitHub Pages
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Gjør klar for GitHub Pages
        run: |
          # Ingen SPA-støtte på Pages: ukjente adresser (f.eks. /oppskrift/123) får 404.html,
          # så den må være selve appen. .nojekyll slår av Jekyll-behandling.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publiser til gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publiser ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
