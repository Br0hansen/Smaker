# Bygger appen og publiserer den på GitHub Pages: https://<bruker>.github.io/<repo>/
# Krever én gang: Settings → Pages → Source: «GitHub Actions».
name: Publiser på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tester
        run: |
          npm test
          npm run test:db
      - name: Bygg
        run: npm run build
        env:
          # Appen ligger under /<repo>/ på GitHub Pages
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages har ingen SPA-støtte: ukjente adresser (f.eks. /oppskrift/123) får 404.html,
      # så den må være selve appen.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
